<!DOCTYPE html>
<html lang="es">
<head>
    <metacharset="UTF-8">
    <metaname="viewport"content="width=device-width, initial-scale=1.0">
    <title>Mi Página con Bootstrap 5</title>
    <!-- CSS de Bootstrap 5 -->
    <linkhref="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet"integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"crossorigin="anonymous">
</head>
<body>
 
   
    <!-- JavaScript de Bootstrap 5 (incluye Popper) -->
    <scriptsrc="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"crossorigin="anonymous"></script>
</body>
</html>
<script>
const usuarios = [
    { id: 1, nombre: "Ana", edad: 25 },
    { id: 2, nombre: "Carlos", edad: 30 },
    { id: 3, nombre: "Lucía", edad: 22 }
];

const contenedor = document.querySelector("#contenedorUsuarios");

function renderizarUsuarios(lista) {
    contenedor.innerHTML = lista.map(({ id, nombre, edad }) => `
        <div class="card shadow-sm mb-3 tarjeta-usuario" id="tarjeta-${id}">
            <div class="card-body d-flex justify-content-between align-items-center p-3">
                <p class="mb-0 fw-bold">
                    ${nombre} <span class="text-muted fw-normal">(${edad} años)</span>
                </p>
                <button>
                    Eliminar
                </button>
            </div>
        </div>
    `)
}


contenedor.addEventListener("click", (e) => {
    if (e.target.classList.contains("btn-eliminar")) {
        const idAEliminar = e.target.dataset.id;
        //alert(idAEliminar)
        const tarjeta = document.querySelector(`#tarjeta-${idAEliminar}`);
        if (tarjeta) tarjeta.remove();
    }
})

renderizarUsuarios(usuario);
</script>
